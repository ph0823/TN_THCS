function tokens(s){return Array.from(new Set(s.normalize("NFC").toLowerCase().trim().split(/\s+/).filter(Boolean)))}
function predict(q,data){var a=tokens(q),best=[],max=0;data.forEach(function(x){var b=tokens(x[1]),common=a.filter(function(w){return b.indexOf(w)!==-1}),u=new Set(a.concat(b)).size,v=u?common.length/u:0,item={id:x[0],q:x[1],label:x[2],common:common,union:u,score:v};if(v>max+1e-12){max=v;best=[item]}else if(Math.abs(v-max)<1e-12){best.push(item)}});return {label:max===0||new Set(best.map(function(x){return x.label})).size!==1?"?":best[0].label,score:max,best:max?best:[]}}
function evaluate(data){var scores=[0,0,0],rows=T.map(function(x){var p=predict(x[1],data);if(p.label===x[2])scores[x[3]]++;return {id:x[0],q:x[1],expected:x[2],group:x[3],prediction:p}});return {scores:scores,rows:rows,total:scores.reduce(function(a,b){return a+b},0),gap:25*(Math.max.apply(null,scores)-Math.min.apply(null,scores))}}

function home(){view="home";html('<section class="panel" style="max-width:540px;margin:24px auto"><h1>Bắt đầu thực hành</h1><p>Em chọn lớp, nhập số thứ tự và họ tên để vào bài.</p><form id="loginForm"><label class="field" for="cl">Lớp</label><select id="cl" required>'+option("","Chọn lớp","")+Array.from({length:9},function(_,i){return option("9A"+(i+1),"9A"+(i+1),"")}).join("")+'</select><label class="field" for="st1">Số thứ tự (1–50)</label><input id="st1" type="number" min="1" max="50" step="1" inputmode="numeric" required placeholder="Nhập số thứ tự"><label class="field" for="fullname">Họ và tên</label><input id="fullname" maxlength="70" autocomplete="off" required placeholder="Nhập họ và tên của em"><div class="actions"><button type="submit" class="primary" style="width:100%">Bắt đầu</button></div></form><small>Nếu em đã làm bài trên máy này, ứng dụng sẽ tự mở lại tiến độ.</small></section>');el("loginForm").onsubmit=function(e){e.preventDefault();startStudent()};if(!storageOK)msg("Không thể lưu trên máy này. Hãy tải kết quả trước khi rời trang.",true)}
function startStudent(){var cl=el("cl").value,raw=el("st1").value.trim(),name=cleanName(el("fullname").value),m=String(Number(raw));if(!/^9A[1-9]$/.test(cl)||!/^\d{1,2}$/.test(raw)||Number(m)<1||Number(m)>50||!validName(name)){msg("Em hãy chọn lớp, nhập STT từ 1 đến 50 và họ tên hợp lệ.",true);return}var candidates=Object.keys(db.records).map(function(k){return db.records[k]}).filter(function(r){return r.cl===cl&&r.lesson==="BAI6"&&r.students.length===1&&r.students[0]===m}).sort(function(a,b){return b.updated.localeCompare(a.updated)});var found=candidates.find(function(r){return studentName(r,m).toLocaleLowerCase("vi")===name.toLocaleLowerCase("vi")})||candidates.find(function(r){return !studentName(r,m)});if(!found&&candidates.length){msg("STT này đã có bài với tên khác trên máy. Kiểm tra thông tin hoặc nhờ giáo viên.",true);return}s=found||newRecord(cl,"BAI6",[m]);s.names=s.names||{};s.names[m]=name;active=s.id;touch(true);msg("");student()}

function tag(l){return '<span class="tag '+(l==="M"?"m":"")+'">'+lab(l)+'</span>'}

function intro(){var qs=["mượn sách toán","muon sach toan"];return panel("Hai câu, một mục đích",'<p>Hai bạn đọc đều muốn mượn sách Toán. Em dự đoán AI có hiểu giống nhau không?</p><div class="grid">'+qs.map(function(q,i){var p=s.intro[i];return '<div class="tile"><h3>'+esc(q)+'</h3><label class="field">Em dự đoán</label><select data-introguess="'+i+'">'+option("","Chọn dự đoán",p&&p.guess||"")+option("M","Mượn sách",p&&p.guess||"")+option("T","Tìm sách",p&&p.guess||"")+option("?","Chưa chắc",p&&p.guess||"")+'</select><div class="actions">'+btn("Thử AI","intro:"+i,"primary",!p||!p.guess)+'</div>'+(p&&p.result?explain(q,p.result):"")+'</div>'}).join("")+'</div><div class="note">Hai câu cùng mục đích. Một lần AI sai chưa đủ để kết luận thiên lệch. Hãy xem AI đã học gì.</div>'+btn("Tiếp tục","finish:0","primary",!qs.every(function(q,i){return s.intro[i]&&s.intro[i].result})))}

function train(){return panel("Bộ dữ liệu A · 8 mẫu",'<p>AI có đủ hai nhãn nhưng đã học đủ các cách diễn đạt chưa?</p><div class="grid">'+["T","M"].map(function(l){return '<div><h3>'+lab(l)+'</h3>'+A.filter(function(x){return x[2]===l}).map(dataTile).join("")+'</div>'}).join("")+'</div><div class="grid3">'+names.map(function(n,i){return '<div class="stat">'+n+'<b>'+(i===0?8:0)+'</b></div>'}).join("")+'</div><label class="field">Nhóm nào có nguy cơ được phục vụ kém?</label><select id="guess">'+option("","Chọn dự đoán",s.guess)+option("0","Câu quen thuộc",s.guess)+option("1","Câu biến thể",s.guess)+option("2","Câu không dấu",s.guess)+option("both","Cả biến thể và không dấu",s.guess)+'</select><div class="actions">'+btn(s.trainedA?"Nạp lại bộ A":"Huấn luyện bộ A","trainA","primary",!s.guess)+btn("Kiểm thử 12 câu","testA","",!s.trainedA)+'</div>'+(s.base?stats(s.base)+bars(s.base,null)+resultRows(s.base)+'<div class="note">Cân bằng hai nhãn không đồng nghĩa dữ liệu đa dạng.</div>'+btn("Sang cải tiến","finish:1","primary"):""))}

app.addEventListener("click",function(e){var b=e.target.closest("button[data-act]");if(!b||b.disabled)return;var act=b.dataset.act,p=act.split(":"),a=p[0],v=p[1];msg("");if(a==="start"){startStudent();return}if(a==="resume"){s=db.records[v];active=v;save(true);student();return}if(a==="import"){el("importFile").click();return}if(a==="csv"){csv();return}if(a==="backup"){fileSave("FairAI_sao_luu.json",JSON.stringify({schema:1,records:Object.keys(db.records).map(function(k){return db.records[k]})},null,2),"application/json");return}if(a==="project"){projection=!projection;teacher();return}if(a==="detail"){teacherSelection=v;teacher();return}if(a==="saveAssessment"){save();return}if(!s)return;if(a==="stage"){goStage(Number(v));return}if(a==="export"){exportRecord();return}if(a==="intro"){var i=Number(v);if(s.intro[i]&&s.intro[i].guess)s.intro[i].result=predict(i?"muon sach toan":"mượn sách toán",A)}else if(a==="trainA"){s.trainedA=true}else if(a==="testA"&&s.trainedA){s.base=evaluate(A)}else if(a==="trainB"&&s.picks.length>0&&s.picks.length<=4){s.trained=s.picks.slice()}else if(a==="testB"&&s.trained&&same(s.trained,s.picks)){var last=latest();if(!last||!same(last.picks,s.picks))s.history.push({id:uid(),at:now(),picks:s.picks.slice(),result:evaluate(pickedData(s.picks))});else msg("Kết quả chiến lược này đã được lưu.")}else if(a==="clearB"){s.picks=[];s.trained=null}else if(a==="freeTest"){var q=(s.free||"").trim(),ex=s.expect,h=latest();if(!q||["T","M"].indexOf(ex)<0){msg("Nhập câu mới và chọn mục đích trước khi thử.",true);return}if(!h||!s.trained||!same(s.trained,s.picks)||!same(h.picks,s.picks))return;if(A.concat(B,T).some(function(x){return tokens(x[1]).join(" ")===tokens(q).join(" ")})){msg("Em hãy tự tạo một câu khác với các mẫu có sẵn.",true);return}if(/\b\d{9,}\b|[\w.+-]+@[\w.-]+\.[a-z]{2,}/i.test(q)){msg("Không nhập số điện thoại hoặc email.",true);return}if(!s.trials.some(function(t){return t.q===q&&t.expected===ex&&same(t.picks,s.picks)}))s.trials.push({q:q,expected:ex,picks:s.picks.slice(),prediction:predict(q,pickedData(s.picks)),at:now()})}else if(a==="auditCheck"){s.audit=true}else if(a==="member"){if(s.students.indexOf(v)>=0)s.member=v}else if(a==="submitTicket"){var t=s.tickets[s.member];if(t&&t.a.trim()&&t.b.trim()){t.submitted=true;s.done[4]=s.students.every(function(m){return s.tickets[m]&&s.tickets[m].submitted});msg("Đã lưu câu trả lời STT "+s.member+".")}}else if(a==="finish"){var n=Number(v);finish(n);return}touch(true);student()});
el("homeBtn").onclick=function(){active="";s=null;save(true);msg("");home()};el("teacherBtn").onclick=function(){msg("");projection=false;teacher()};el("tvBtn").onclick=function(){document.body.classList.toggle("tv");this.textContent=document.body.classList.contains("tv")?"Màn hình thường":"Màn hình lớn"};
load();if(view==="student")student();else home();if(!storageOK)msg("Không thể khôi phục bộ nhớ. Hãy tải kết quả trước khi đóng trang.",true);
})();
