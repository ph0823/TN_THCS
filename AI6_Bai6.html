add("q01","1. Trước khi cho phép ứng dụng AI truy cập dữ liệu cá nhân, em cần làm gì?",["Xem cách trình bày của ứng dụng.", "Tìm hiểu lí do cần truy cập.", "Xem số lượt tải của ứng dụng.", "Tìm hiểu tốc độ của ứng dụng."],1,"Chỉ cấp quyền khi hiểu lí do và thấy cần thiết.");
add("q02","2. Ứng dụng AI luyện phát âm có thể cần sử dụng thiết bị nào?",["Loa.", "Màn hình.", "Webcam.", "Micro."],3,"Micro giúp ứng dụng thu âm giọng nói.");
add("q03","3. Vì sao cần cân nhắc khi ứng dụng học từ vựng yêu cầu truy cập danh bạ?",["Danh bạ thường không cần cho việc học từ vựng.", "Danh bạ có thể làm thay đổi nội dung bài học.", "Danh bạ giúp ứng dụng nhận biết từ khó hơn.", "Danh bạ có thể làm giảm số lượng từ mới."],0,"Danh bạ chứa thông tin cá nhân không cần thiết cho chức năng này.");
add("q04","4. Việc cấp quyền truy cập cho ứng dụng AI nên dựa vào yếu tố nào?",["Mức độ nổi tiếng của ứng dụng.", "Số lượng người đang sử dụng.", "Sự cần thiết đối với chức năng.", "Số lượng tính năng được giới thiệu."],2,"Quyền truy cập phải phù hợp với chức năng.");
add("q05","5. Một ứng dụng AI học tiếng Anh yêu cầu biết vị trí của em. Em nên hỏi gì?",["Vị trí được hiển thị trên bản đồ nào?", "Vì sao học tiếng Anh cần biết vị trí?", "Vị trí được xác định bằng thiết bị nào?", "Vị trí có được cập nhật thường xuyên?"],1,"Cần hiểu mục đích trước khi chia sẻ vị trí.");
add("q06","6. Mai đang dùng AI luyện phát âm. Ứng dụng yêu cầu truy cập micro và danh bạ. Mai nên làm gì?",["Cân nhắc cho dùng micro, từ chối danh bạ.", "Cho phép dùng cả hai để học thuận tiện.", "Cho phép danh bạ, từ chối dùng micro.", "Cấp cả hai quyền rồi kiểm tra sau."],0,"Micro có thể cần cho phát âm, danh bạ thường không cần.");
add("q07","7. Câu hỏi nào giúp em biết ai chịu trách nhiệm cung cấp ứng dụng AI?",["Ứng dụng có những tính năng nào?", "Ứng dụng được sử dụng ở đâu?", "Ai là người cung cấp ứng dụng?", "Ai thường xuyên sử dụng ứng dụng?"],2,"Tên nhà cung cấp giúp xác định đơn vị chịu trách nhiệm.");
add("q08","8. Muốn biết ứng dụng AI lấy những thông tin nào của mình, em cần hỏi gì?",["Ứng dụng thu thập dữ liệu gì?", "Ứng dụng có những bài học gì?", "Ứng dụng hỗ trợ ngôn ngữ gì?", "Ứng dụng có những phiên bản gì?"],0,"Hỏi trực tiếp về loại dữ liệu được thu thập.");
add("q09","9. Câu hỏi nào giúp em kiểm tra mục đích sử dụng dữ liệu?",["Dữ liệu được hiển thị ở đâu?", "Dữ liệu được nhập bằng cách nào?", "Dữ liệu có dung lượng bao nhiêu?", "Dữ liệu được dùng để làm gì?"],3,"Mục đích cho biết vì sao ứng dụng cần dữ liệu.");
add("q10","10. Câu hỏi nào giúp em kiểm tra khả năng kiểm soát dữ liệu cá nhân?",["Ứng dụng lưu dữ liệu ở đâu?", "Em có thể xóa dữ liệu không?", "Ứng dụng thu thập dữ liệu gì?", "Dữ liệu được dùng để làm gì?"],1,"Khả năng xóa dữ liệu là một cách kiểm soát dữ liệu.");
add("q11","11. Vì sao cần kiểm tra độ tuổi được phép sử dụng ứng dụng AI?",["Để biết số lượng bài học được cung cấp.", "Để biết ứng dụng có nhiều người dùng.", "Để biết ứng dụng có phù hợp với mình.", "Để biết thời gian hoàn thành bài học."],2,"Ứng dụng có thể quy định độ tuổi tối thiểu.");
add("q12","12. Một ứng dụng AI có thông tin minh bạch nghĩa là gì?",["Ứng dụng có nhiều người sử dụng.", "Ứng dụng có giao diện dễ quan sát.", "Ứng dụng có nhiều chức năng học tập.", "Ứng dụng cung cấp thông tin rõ ràng."],3,"Minh bạch là cung cấp thông tin rõ ràng, không đồng nghĩa an toàn tuyệt đối.");
add("q13","13. Ứng dụng AI lưu những bài học em đã hoàn thành. Để biết lí do lưu dữ liệu, em nên hỏi gì?",["Lịch sử học tập được dùng làm gì?", "Lịch sử học tập được hiển thị ở đâu?", "Lịch sử học tập được sắp xếp thế nào?", "Lịch sử học tập được mở bằng nút nào?"],0,"Câu hỏi này làm rõ mục đích lưu lịch sử.");
add("q14","14. Khi hồ sơ ứng dụng AI nêu rõ một tiêu chí được đáp ứng, em chọn trạng thái nào?",["Không.", "Có.", "Chưa rõ.", "Chưa đọc."],1,"Có nghĩa là có thông tin cho thấy tiêu chí được đáp ứng.");
add("q15","15. Khi hồ sơ ứng dụng AI chưa cung cấp đủ thông tin để đánh giá một tiêu chí, em chọn trạng thái nào?",["Không.", "Có.", "Chưa rõ.", "Đã kiểm tra."],2,"Thiếu thông tin thì chưa thể kết luận có hay không.");
add("q16","16. Một ứng dụng AI ghi rõ chỉ dành cho người từ 16 tuổi. Khi kiểm tra sự phù hợp với học sinh 12 tuổi, em chọn gì?",["Có, vì đây là ứng dụng học tập.", "Chưa rõ, vì chưa biết cách sử dụng.", "Có, vì ứng dụng có ghi độ tuổi.", "Không, vì chưa đủ tuổi sử dụng."],3,"Học sinh 12 tuổi chưa đáp ứng quy định 16 tuổi.");
add("q17","17. Hồ sơ ứng dụng AI không đề cập đến việc xóa dữ liệu cá nhân. Em nên nhận xét thế nào?",["Chưa rõ có thể xóa dữ liệu không.", "Có thể xóa dữ liệu khi cần thiết.", "Không thể xóa dữ liệu đã được lưu.", "Dữ liệu sẽ tự xóa sau khi sử dụng."],0,"Không đề cập không có nghĩa là không thể xóa.");
add("q18","18. Điểm khác nhau giữa trạng thái “Không” và “Chưa rõ” là gì?",["“Không” là chưa đọc, “Chưa rõ” là đã đọc.", "“Không” là không đáp ứng, “Chưa rõ” là thiếu thông tin.", "“Không” là thiếu thông tin, “Chưa rõ” là không đáp ứng.", "“Không” là ít thông tin, “Chưa rõ” là nhiều thông tin."],1,"Cần phân biệt bằng chứng không đáp ứng với thiếu bằng chứng.");
add("q19","19. Một ứng dụng có nút xóa lịch sử trên máy nhưng chưa nói đến dữ liệu lưu ở nơi khác. Em có thể kết luận gì?",["Dữ liệu ở mọi nơi đã được xóa.", "Dữ liệu ở nơi khác sẽ tự xóa.", "Chưa rõ dữ liệu ở nơi khác có được xóa.", "Dữ liệu ở nơi khác không thể xóa."],2,"Xóa trên máy chưa chứng minh dữ liệu ở nơi khác đã được xóa.");
add("q20","20. Mức đánh giá Xanh khi kiểm tra ứng dụng AI có ý nghĩa gì?",["Có thể sử dụng mà không cần hỏi.", "Cần ngừng sử dụng trong tình huống này.", "Cần tìm thêm thông tin còn thiếu.", "Có dấu hiệu phù hợp, vẫn cần kiểm tra."],3,"Mức Xanh không bảo đảm an toàn tuyệt đối.");
add("q21","21. Mức đánh giá Vàng khi kiểm tra ứng dụng AI có ý nghĩa gì?",["Có đủ thông tin để đăng kí ngay.", "Cần hỏi thêm trước khi quyết định.", "Chưa nên dùng vì không đủ tuổi.", "Có thể bỏ qua việc kiểm tra dữ liệu."],1,"Mức Vàng nhắc em tìm thêm thông tin.");
